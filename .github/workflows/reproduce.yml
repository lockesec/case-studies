# Reproduces every claim in both studies at pinned tool commits.
#
# The five tools are pinned to their v0.1.0 release commits. A change to a tool reaches this
# workflow only through a pull request that bumps its pin.
#
# GitHub-hosted runners only: never attach a self-hosted runner to a public repository.
name: reproduce
on:
  workflow_dispatch: {}
  push: {}
  pull_request: {}
  schedule: [{cron: "17 6 * * 1"}]   # weekly: the sources and the MITRE data move
permissions: {contents: read}
env:   # the claim is "reproduced AT these commits"; bump by pull request
  HIK: d276e8650fd39833194ed7f06af04cf9611e6f17
  IS: 1cb468144e8247df42294129160e9376994cfdad
  CRL: 7dc7757dfc343ad71eedb8c2789488060cfd6ab9
  PG: d49f50583ae47d9fb932b480ba07e29a5d7c53ab
  IDL: 97c6581b55c2d3619a1674da447ddfe788c407e2
  ATTACK_SHA: 81113ba98afa2928f3dcff62022539f7ce30c315c32e14422f11ff95ce534352
  ATLAS_SHA: 935efa93e28294432d3e2f537eb94991ef8d1f8c58341cd360ea3321ddb66688
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - name: MITRE data, pinned and hashed
        run: |
          mkdir -p ~/mitre && cd ~/mitre
          curl -fsSLO https://raw.githubusercontent.com/mitre-attack/attack-stix-data/20664a889568dce884a1dac0ec7b12ae3a199f51/enterprise-attack/enterprise-attack-20.0.json
          curl -fsSLO https://github.com/mitre-atlas/atlas-data/releases/download/v2026.09/ATLAS-2026.09.yaml
          printf '%s  enterprise-attack-20.0.json\n%s  ATLAS-2026.09.yaml\n' "$ATTACK_SHA" "$ATLAS_SHA" | sha256sum -c
      - name: Tools at pinned commits
        run: |
          R=https://github.com/lockesec
          pip install "git+$R/hook-integrity-kit@$HIK" "git+$R/injection-screen@$IS" "git+$R/cti-report-lint@$CRL" "git+$R/publish-gate@$PG" "git+$R/instinct-delivery@$IDL" pyyaml
          git clone -q $R/instinct-delivery ~/idl && git -C ~/idl checkout -q "$IDL"
          for t in hook-integrity-kit injection-screen cti-report-lint publish-gate instinct-delivery; do $t --version; done
      - name: Reproduce (exit 2 = some claim did not run = red)
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", ID: /home/runner/idl}
        run: |
          set -o pipefail
          ATTACK_JSON=~/mitre/enterprise-attack-20.0.json sh mini-shai-hulud/reproduce.sh | tee mini.txt
          ATLAS_YAML=~/mitre/ATLAS-2026.09.yaml sh mcp-prompt-injection/reproduce.sh | tee mcp.txt
          grep -q '^13 reproduced, 0 failed, 0 skipped' mini.txt && grep -q '^13 reproduced, 0 failed, 0 skipped' mcp.txt
